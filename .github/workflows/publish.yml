# Publishes to npm when a GitHub release is published, with npm trusted publishing
# (OIDC, no token; provenance is attached automatically). One-time setup on
# npmjs.com > pexafy-ai-sdk > Settings > Trusted Publisher: GitHub Actions,
# organization "Pexafy", repository "pexafy-ai-sdk", workflow "publish.yml".
name: publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - name: Skip a version that is already on npm
        id: check
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "pexafy-ai-sdk@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "pexafy-ai-sdk@$v is already on npm, nothing to publish"
          fi
      - if: steps.check.outputs.published != 'true'
        run: npm publish --access public
