name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { node: 20, ai: 5 }
          - { node: 22, ai: 6 }
          - { node: 22, ai: 7 }
          - { node: 24, ai: 7 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.ai != 7
        run: npm install --no-save ai@${{ matrix.ai }}
      - if: matrix.ai == 7
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
